services:
  backend:
    build: .
    container_name: event-backend
    restart: always
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx wait-on tcp:db:5432 && npm run dev"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/eventdb
    ports:
      - "4000:4000"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: event-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: